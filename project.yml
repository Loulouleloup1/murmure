name: Murmure
options:
  bundleIdPrefix: com.louiscourcier
  deploymentTarget:
    macOS: "14.0"
packages:
  MurmureCore:
    path: MurmureCore
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "1.1.0"
  # Pinned EXACTLY, not `from:`. The notch is the root component of Murmure's interface and the
  # plan's whole no-jump argument is read off this tag's source (lot 3 §2/D1); a minor bump that
  # changed `NotchView`'s masking or the compact/expanded defaults would move the interface
  # without a line of Murmure changing. MIT, ~1 200 lines -- a fork is the escape hatch.
  DynamicNotchKit:
    url: https://github.com/MrKai77/DynamicNotchKit
    exactVersion: "1.1.0"
  # Pinned EXACTLY for the same reason, one layer down (lot 4 D5). GRDB carries the schema
  # migrator and the FTS5 external-content triggers behind `HistoryStore`; a minor bump that
  # changed either would move Louis's archive with no code change to point at. The version is
  # kept identical to the one MurmureCore/Package.swift pins -- two pins of one library that
  # disagreed would resolve to whichever SwiftPM read second. MIT.
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: "7.11.1"
targets:
  Murmure:
    type: application
    platform: macOS
    sources: [Murmure]
    dependencies:
      - package: MurmureCore
      - package: WhisperKit
      - package: DynamicNotchKit
      # Named here so the pin above is a pin and not a comment: XcodeGen only emits a package
      # reference that a target depends on. The app does not `import GRDB` -- it reaches the
      # database through `HistoryStore` -- but MurmureCore links it, so it is in the binary
      # either way, and declaring it is what makes the version visible in the generated project.
      - package: GRDB
        product: GRDB
    settings:
      base:
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
        # The catalog is generated, never hand-edited: `swift scripts/make-icon.swift` draws every
        # size from the same accent and palette the interface uses, so the icon cannot drift from
        # the app it names.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Murmure/Info.plist
      properties:
        LSUIElement: true
        NSMicrophoneUsageDescription: "Murmure records your voice to transcribe it locally."
